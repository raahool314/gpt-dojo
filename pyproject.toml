[project]
name = "gpt-dojo"
version = "0.1.0"
description = "Train a GPT from scratch — one concept, one gate at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
    "torch>=2.1.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest",
    "jupyter",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["modules"]
addopts = "-q"